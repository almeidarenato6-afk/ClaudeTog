def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '0.1.0'

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'dev.flutter.flutter-gradle-plugin'
// Uncomment once google-services.json (from `flutterfire configure`) exists:
// apply plugin: 'com.google.gms.google-services'

android {
    namespace 'br.com.togplay.vaimarcia'
    compileSdk 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId 'br.com.togplay.vaimarcia'
        // Bluetooth Classic A2DP APIs used by BluetoothTransportPlugin.kt
        // require API 31 (Android 12) at minimum for the runtime
        // BLUETOOTH_CONNECT permission model this manifest declares.
        minSdk 26
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            // TODO: wire real release signing config before shipping to
            // Play Store — currently signs with the debug key so
            // `flutter build apk` doesn't fail out of the box.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.13.1'
    // Wear OS Data Layer API — consumed by WatchCompanionPlugin.kt.
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
}
