# Especificação do XcodeGen — rode `xcodegen generate` neste diretório para produzir
# o VaiMarciaWatch.xcodeproj. Um .xcodeproj escrito à mão (um formato pbxproj próximo de
# plist binário, extremamente frágil) não pode ser produzido de forma confiável fora do
# próprio Xcode, então esta especificação declarativa é a fonte de verdade pragmática. Veja o README.md.
name: VaiMarciaWatch
options:
  bundleIdPrefix: com.togplay.vaimarcia
  deploymentTarget:
    watchOS: "9.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  VaiMarciaWatchApp:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: "VaiMarciaWatch Watch App"
    info:
      path: "VaiMarciaWatch Watch App/Info.plist"
      properties:
        UIBackgroundModes:
          - audio
        WKBackgroundModes:
          - audio
        NSBluetoothAlwaysUsageDescription: "Vai Márcia usa Bluetooth para tocar áudios direto na sua caixa de som ou avisar seu celular."
        WKApplication: true
        WKWatchKitApp: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.togplay.vaimarcia.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_PREVIEWS: true
    dependencies: []

schemes:
  VaiMarciaWatchApp:
    build:
      targets:
        VaiMarciaWatchApp: all
    run:
      config: Debug
