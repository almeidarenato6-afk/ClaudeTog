name: mobile-ci

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**"]
  pull_request:
    paths: ["apps/mobile/**"]

defaults:
  run:
    working-directory: apps/mobile

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage

  build-android:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build appbundle --release
        env:
          # A configuração real de assinatura precisa vir de secrets do
          # repositório antes que este passo gere um artefato pronto para
          # loja; ver docs/PUBLISHING_CHECKLIST.md
          SKIP_SIGNING: "true"

  build-ios:
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
