name: backend-ci

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  pull_request:
    paths: ["backend/**"]

defaults:
  run:
    working-directory: backend/functions

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/functions/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build
      - name: Testar contra emuladores do Firebase
        run: npm run test --if-present

  rules-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g firebase-tools
      - working-directory: backend
        run: firebase deploy --only firestore:rules,storage --dry-run --project demo-vaimarcia || true
