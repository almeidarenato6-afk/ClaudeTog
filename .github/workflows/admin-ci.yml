name: admin-ci

on:
  push:
    branches: [main]
    paths: ["admin/**"]
  pull_request:
    paths: ["admin/**"]

defaults:
  run:
    working-directory: admin

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run test --if-present
      - run: npm run build
