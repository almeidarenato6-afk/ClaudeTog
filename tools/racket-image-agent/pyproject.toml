[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "racket-image-agent"
version = "1.0.0"
description = "Agente de coleta, validacao e organizacao de fotos de raquetes de beach tennis no Google Drive."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "google-api-python-client>=2.126.0",
    "google-auth>=2.29.0",
    "requests>=2.31.0",
    "Pillow>=10.3.0",
    "beautifulsoup4>=4.12.3",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
racket-image-agent = "racket_image_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
